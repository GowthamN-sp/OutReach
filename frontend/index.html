<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10121a" />
    <title>OutreachDesk</title>
    <script>
      try {
        if (localStorage.getItem("outreachdesk.theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector("meta[name=theme-color]").content = "#f5f6fb";
        }
      } catch {}
    </script>
    <style>
      html {
        background: #10121a;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background: #f5f6fb;
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
